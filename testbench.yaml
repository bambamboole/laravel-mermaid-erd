laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

workbench:
  start: /mermaid-erd
  install: false
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    factories: false
    views: false
  build:
    - create-sqlite-db
    - migrate-fresh
